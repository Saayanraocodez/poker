name: Refine and verify range endpoint evidence
on:
  push:
    branches: [claude/funny-heisenberg-ga1r59]
    paths: [refine_attainment.py, .github/workflows/refine-attainment.yml]
permissions:
  contents: read
  actions: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        leaf: [18,62,70,72,77,97,99,196,198,211,440,469]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy sympy
      - run: python makeD.py
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '44449135893'
          name: attainment-verified
          path: attainment
      - run: python refine_attainment.py ${{ matrix.leaf }}
      - uses: actions/upload-artifact@v4
        with:
          name: attainment-${{ matrix.leaf }}
          path: attainment/leaf-${{ matrix.leaf }}.json.gz
  verify:
    needs: search
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy sympy
      - uses: actions/download-artifact@v4
        with:
          pattern: attainment-*
          path: attainment
          merge-multiple: true
      - run: python makeD.py
      - run: python check_attainment.py | tee attainment/replay.log
        shell: bash
      - run: python test_attainment_checker.py | tee attainment/negative-controls.log
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: attainment-verified
          path: attainment/
